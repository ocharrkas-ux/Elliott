name: Elliott
options:
  bundleIdPrefix: com.omarcharrkas
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 3JG68S88LM
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"

# Elliott: app + root pf helper. Signs with any team, including a free Personal Team.
# ElliottNE: the same app plus the per-app Network Extension content filter. Needs a paid Apple Developer
# Program team (Personal Teams can't get the Network Extension / System Extension capabilities).
targets:
  Elliott:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Helper/com.omarcharrkas.elliott.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: ElliottHelper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarcharrkas.elliott
        PRODUCT_NAME: Elliott
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Elliott.entitlements

  ElliottHelper:
    type: tool
    platform: macOS
    sources: [Helper/main.swift, Helper/NameCapture.swift, Helper/PcapRecorder.swift, Shared]
    dependencies:
      - sdk: libpcap.tbd
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Helper/Helper-Bridging.h
        PRODUCT_BUNDLE_IDENTIFIER: com.omarcharrkas.elliott.helper
        PRODUCT_NAME: ElliottHelper
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
        OTHER_CODE_SIGN_FLAGS: "--identifier com.omarcharrkas.elliott.helper"

  ElliottNE:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Helper/com.omarcharrkas.elliott.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - target: ElliottHelper
        embed: true
        copy:
          destination: executables
      - target: ElliottFilter
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarcharrkas.elliott
        PRODUCT_NAME: Elliott
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/ElliottNE.entitlements

  ElliottFilter:
    type: system-extension
    platform: macOS
    sources: [Filter, Shared]
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarcharrkas.elliott.filter
        PRODUCT_NAME: com.omarcharrkas.elliott.filter
        INFOPLIST_FILE: Filter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Filter/Filter.entitlements
        SKIP_INSTALL: YES

  ElliottTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Elliott
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omarcharrkas.elliott.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Elliott.app/Contents/MacOS/Elliott"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Elliott:
    build:
      targets:
        Elliott: all
        ElliottTests: [test]
    test:
      targets: [ElliottTests]
  ElliottNE:
    build:
      targets:
        ElliottNE: all
